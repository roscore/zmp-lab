<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="color-scheme" content="light dark">
  <title>ZMP Lab</title>
  <link data-trunk rel="rust" href="crates/zl_web/Cargo.toml" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
  <link data-trunk rel="css" href="web/style.css">
  <link data-trunk rel="copy-file" href="web/boot.js">
</head>
<body>
  <header>
    <div>
      <h1 data-i18n="title">ZMP &amp; capture-point walking lab</h1>
      <p data-i18n="subtitle"></p>
    </div>
    <button id="lang" data-i18n="lang">한국어</button>
  </header>
  <main>
    <section id="panel">
      <h2 data-i18n="presets"></h2>
      <div class="row">
        <button id="p_adult" data-i18n="adult"></button>
        <button id="p_kid" data-i18n="kid"></button>
      </div>
      <h2 data-i18n="gait"></h2>
      <div class="grid">
        <label><span data-i18n="zc"></span><input id="zc" type="number" step="0.01" min="0.05" max="3" inputmode="decimal"></label>
        <label><span data-i18n="g"></span><input id="g" type="number" step="0.01" min="0.1" max="30" inputmode="decimal"></label>
        <label><span data-i18n="fl"></span><input id="fl" type="number" step="0.01" min="0.01" max="1" inputmode="decimal"></label>
        <label><span data-i18n="fw"></span><input id="fw" type="number" step="0.01" min="0.01" max="1" inputmode="decimal"></label>
        <label><span data-i18n="sl"></span><input id="sl" type="number" step="0.01" min="-0.5" max="1" inputmode="decimal"></label>
        <label><span data-i18n="sw"></span><input id="sw" type="number" step="0.01" min="0" max="1" inputmode="decimal"></label>
        <label><span data-i18n="tss"></span><input id="tss" type="number" step="0.05" min="0.1" max="3" inputmode="decimal"></label>
        <label><span data-i18n="ds"></span><input id="ds" type="number" step="0.05" min="0" max="0.4" inputmode="decimal"></label>
        <label><span data-i18n="n"></span><input id="n" type="number" step="1" min="2" max="10" inputmode="numeric"></label>
        <label><span data-i18n="k"></span><input id="k" type="number" step="0.1" min="0.1" max="10" inputmode="decimal"></label>
      </div>
      <h2 data-i18n="push_h"></h2>
      <div class="grid">
        <label><span data-i18n="pdv"></span><input id="pdv" type="number" step="0.05" min="0" max="10" value="0.05" inputmode="decimal"></label>
        <label><span data-i18n="pang"></span><input id="pang" type="number" step="15" value="90" inputmode="decimal"></label>
        <label><span data-i18n="pt"></span><input id="pt" type="number" step="0.05" min="0" value="1.8" inputmode="decimal"></label>
      </div>
      <div class="row">
        <button id="push" class="primary" data-i18n="push"></button>
        <button id="clear" data-i18n="clear"></button>
      </div>
      <h2 data-i18n="results"></h2>
      <div id="results"></div>
    </section>
    <section id="stage">
      <div id="view">
        <canvas id="gl"></canvas>
        <div id="nogl" hidden data-i18n="nogl"></div>
        <div id="hud"></div>
        <div id="toggles">
          <button id="t_trails" class="on" data-i18n="trails"></button>
          <button id="t_poly" class="on" data-i18n="poly"></button>
          <button id="t_cp" class="on" data-i18n="cp"></button>
          <button id="t_body" class="on" data-i18n="body"></button>
        </div>
        <div id="views">
          <button id="v_persp" data-i18n="persp"></button>
          <button id="v_top" data-i18n="top"></button>
          <button id="v_side" data-i18n="side"></button>
          <button id="v_front" data-i18n="front"></button>
        </div>
      </div>
      <p class="hint" data-i18n="hint"></p>
      <div id="play">
        <button id="playbtn"></button>
        <label><span data-i18n="speed"></span>
          <select id="speed">
            <option value="0.1">0.1×</option>
            <option value="0.25" selected>0.25×</option>
            <option value="1">1×</option>
          </select>
        </label>
        <input id="time" type="range" min="0" max="10" step="0.005" value="0">
        <span id="tlabel"></span>
      </div>
      <canvas id="plotx" class="plot"></canvas>
      <canvas id="ploty" class="plot"></canvas>
    </section>
  </main>
  <footer data-i18n="disclaimer"></footer>
</body>
</html>
