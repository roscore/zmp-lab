[package]
name = "zl_web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ZMP & capture-point walking lab: web UI (WebGL2 + canvas 2D)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zl_core = { path = "../zl_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
  "HtmlSelectElement", "Navigator", "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent",
  "KeyboardEvent", "CanvasRenderingContext2d", "DomRect", "CssStyleDeclaration", "MediaQueryList",
  "Storage", "DomTokenList", "NodeList", "TextMetrics", "console",
  "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation",
  "WebGlVertexArrayObject", "WebGlContextAttributes",
]
